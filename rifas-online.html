<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifas — Reserva tu número</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #F3F4EF;
    --surface: #FFFFFF;
    --ink: #1B1D29;
    --ink-soft: #5B5E6B;
    --border: #E1E0D6;
    --accent: #C98A2E;
    --accent-ink: #4A2E07;
    --libre-bg: #E4F0E6; --libre-fg: #2F6B45; --libre-solid: #4C9A6A;
    --porpagar-bg: #FBEAD6; --porpagar-fg: #8A5416; --porpagar-solid: #D98E3E;
    --pagado-bg: #E7E6FA; --pagado-fg: #4038A8; --pagado-solid: #5B5BD6;
    --danger: #B3452F;
    --shadow: 0 1px 2px rgba(27,29,41,0.06), 0 4px 14px rgba(27,29,41,0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3, .display { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  header.top { display: flex; flex-direction: column; gap: 10px; }
  .brand { display: flex; align-items: center; justify-content: space-between; }
  .brand h1 { font-size: 1.4rem; }
  .brand .admin-link { font-size: 0.78rem; color: var(--ink-soft); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .meta-sub { color: var(--ink-soft); font-size: 0.82rem; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn { padding: 11px 16px; border-radius: 10px; font-size: 0.92rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn.danger-outline { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 0.78rem; color: var(--ink-soft); font-weight: 500; }
  .field input, .field select, .field textarea {
    padding: 10px 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink); font-family: inherit; font-size: 0.95rem;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { border-radius: 12px; padding: 10px 6px; text-align: center; background: var(--surface); border: 1px solid var(--border); }
  .stat .num { font-family: "Fraunces", serif; font-size: 1.25rem; font-weight: 600; display: block; }
  .stat .lbl { font-size: 0.65rem; color: var(--ink-soft); }
  .stat.libre .num { color: var(--libre-fg); }
  .stat.porpagar .num { color: var(--porpagar-fg); }
  .stat.pagado .num { color: var(--pagado-fg); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--ink-soft); padding: 0 2px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
  .num-btn {
    aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; justify-content: center;
  }
  .num-btn.libre { background: var(--libre-bg); color: var(--libre-fg); border-color: transparent; }
  .num-btn.porpagar { background: var(--porpagar-bg); color: var(--porpagar-fg); border-color: transparent; }
  .num-btn.pagado { background: var(--pagado-bg); color: var(--pagado-fg); border-color: transparent; }
  .num-btn[disabled] { cursor: not-allowed; }
  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty .display { font-size: 1.25rem; color: var(--ink); margin-bottom: 6px; }
  .list-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-row .info b { font-family: "Fraunces", serif; }
  .list-row .info .meta-sub { margin-top: 2px; }
  .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .badge.porpagar { background: var(--porpagar-bg); color: var(--porpagar-fg); }
  .badge.pagado { background: var(--pagado-bg); color: var(--pagado-fg); }
  .sheet-overlay { position: fixed; inset: 0; background: rgba(20,21,27,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .sheet-overlay.open { display: flex; }
  .sheet-overlay.center { align-items: center; padding: 20px; }
  .sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; }
  .sheet-overlay.center .sheet { border-radius: 18px; }
  .sheet h3 { font-size: 1.15rem; margin-bottom: 12px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .sheet-actions .btn { flex: 1; }
  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 200; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .spinner-line { text-align: center; padding: 30px; color: var(--ink-soft); }
  select.rifa-picker { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-family: inherit; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="sheet-overlay" id="numberSheetOverlay"><div class="sheet" id="numberSheet"></div></div>
<div class="sheet-overlay center" id="rifaSheetOverlay"><div class="sheet" id="rifaSheet"></div></div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyC61viIL19kpALAmq3hh7TEfiUwj9C1Sfs",
    authDomain: "rifas-app-8eb4f.firebaseapp.com",
    projectId: "rifas-app-8eb4f",
    storageBucket: "rifas-app-8eb4f.firebasestorage.app",
    messagingSenderId: "966786678690",
    appId: "1:966786678690:web:fc54501de17bbd567bfcfb"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();

  function qs(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var isAdminRoute = qs("admin") === "1";
  var urlRifaId = qs("rifa");

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    var fixed = Number(n).toFixed(2);
    var parts = fixed.split(".");
    var intPart = parts[0];
    var neg = intPart.charAt(0) === "-";
    if (neg) intPart = intPart.slice(1);
    var out = "";
    for (var i = 0; i < intPart.length; i++) {
      var posFromEnd = intPart.length - i;
      out += intPart.charAt(i);
      if (posFromEnd > 1 && posFromEnd % 3 === 1) out += ",";
    }
    return (neg ? "-$" : "$") + out + "." + parts[1];
  }

  function fmtDate(iso) {
    if (!iso) return "Sin fecha";
    var parts = iso.split("-");
    if (parts.length !== 3) return iso;
    var meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    return parseInt(parts[2], 10) + " " + meses[parseInt(parts[1], 10) - 1] + " " + parts[0];
  }

  function padNum(i, total) {
    return String(i + 1).padStart(String(total).length, "0");
  }

  // =========================================================
  // BUYER VIEW
  // =========================================================

  var buyer = {
    rifaId: urlRifaId || null,
    rifa: null,
    numeros: {},
    unsubNumeros: null,
    unsubRifa: null
  };

  function startBuyer() {
    var app = document.getElementById("app");
    if (buyer.rifaId) {
      loadBuyerRifa(buyer.rifaId);
    } else {
      app.innerHTML = '<div class="spinner-line">Cargando...</div>';
      db.collection("rifas").orderBy("creado", "desc").limit(20).get().then(function (snap) {
        if (snap.empty) {
          renderBuyerEmpty();
          return;
        }
        if (snap.size === 1) {
          buyer.rifaId = snap.docs[0].id;
          loadBuyerRifa(buyer.rifaId);
        } else {
          renderBuyerPicker(snap.docs);
        }
      }).catch(function (err) {
        console.error(err);
        renderBuyerError();
      });
    }
  }

  function renderBuyerEmpty() {
    document.getElementById("app").innerHTML =
      '<div class="empty card"><div class="display">No hay rifas activas</div>' +
      '<p>Todavía no se ha publicado ninguna rifa. Vuelve a intentarlo más tarde.</p></div>';
  }

  function renderBuyerError() {
    document.getElementById("app").innerHTML =
      '<div class="empty card"><div class="display">No se pudo cargar</div>' +
      '<p>Revisa tu conexión a internet e intenta de nuevo.</p>' +
      '<button class="btn primary" onclick="location.reload()">Reintentar</button></div>';
  }

  function renderBuyerPicker(docs) {
    var html = '<header class="top"><div class="brand"><h1>🎟️ Rifas</h1></div></header>';
    html += '<div class="card"><h3 style="margin-bottom:10px;">Elige una rifa</h3>';
    docs.forEach(function (d) {
      var r = d.data();
      html += '<div class="list-row"><div class="info"><b>' + escapeHtml(r.nombre) + '</b><div class="meta-sub">Sorteo: ' + fmtDate(r.fecha) + '</div></div>' +
        '<button class="btn" onclick="RifasOnline.goToRifa(\'' + d.id + '\')">Ver</button></div>';
    });
    html += '</div>';
    document.getElementById("app").innerHTML = html;
  }

  function goToRifa(id) {
    var url = new URL(window.location.href);
    url.searchParams.set("rifa", id);
    window.location.href = url.toString();
  }

  function loadBuyerRifa(id) {
    document.getElementById("app").innerHTML = '<div class="spinner-line">Cargando rifa...</div>';
    if (buyer.unsubRifa) buyer.unsubRifa();
    if (buyer.unsubNumeros) buyer.unsubNumeros();

    buyer.unsubRifa = db.collection("rifas").doc(id).onSnapshot(function (doc) {
      if (!doc.exists) {
        renderBuyerEmpty();
        return;
      }
      buyer.rifa = doc.data();
      buyer.rifa.id = doc.id;
      renderBuyerApp();
    }, function (err) {
      console.error(err);
      renderBuyerError();
    });

    buyer.unsubNumeros = db.collection("rifas").doc(id).collection("numeros").onSnapshot(function (snap) {
      buyer.numeros = {};
      snap.forEach(function (d) { buyer.numeros[d.id] = d.data(); });
      renderBuyerApp();
    }, function (err) {
      console.error(err);
    });
  }

  function renderBuyerApp() {
    if (!buyer.rifa) return;
    var rifa = buyer.rifa;
    var total = rifa.cantidad;
    var libres = 0, porpagar = 0, pagados = 0, recaudado = 0;
    for (var i = 0; i < total; i++) {
      var n = buyer.numeros[String(i)];
      if (!n) libres++;
      else if (n.estado === "pagado") { pagados++; recaudado += (rifa.precio || 0); }
      else porpagar++;
    }

    var html = '<header class="top"><div class="brand"><h1>🎟️ ' + escapeHtml(rifa.nombre) + '</h1></div>' +
      '<div class="meta-sub">Sorteo: ' + fmtDate(rifa.fecha) + (rifa.precio ? ' · ' + fmtMoney(rifa.precio) + ' por número' : '') + '</div></header>';

    html += '<div class="stats">' +
      '<div class="stat libre"><span class="num">' + libres + '</span><span class="lbl">Libres</span></div>' +
      '<div class="stat porpagar"><span class="num">' + porpagar + '</span><span class="lbl">Por pagar</span></div>' +
      '<div class="stat pagado"><span class="num">' + pagados + '</span><span class="lbl">Pagados</span></div>' +
      '<div class="stat"><span class="num">' + fmtMoney(recaudado) + '</span><span class="lbl">Recaudado</span></div>' +
      '</div>';

    html += '<div class="legend">' +
      '<span><span class="dot" style="background:var(--libre-solid)"></span>Libre</span>' +
      '<span><span class="dot" style="background:var(--porpagar-solid)"></span>Por pagar</span>' +
      '<span><span class="dot" style="background:var(--pagado-solid)"></span>Pagado</span>' +
      '</div>';

    html += '<div class="grid">';
    for (var j = 0; j < total; j++) {
      var num = buyer.numeros[String(j)];
      var estado = num ? num.estado : "libre";
      var disabled = estado !== "libre" ? " disabled" : "";
      html += '<button class="num-btn ' + estado + '"' + disabled + ' onclick="RifasOnline.openReserva(' + j + ')">' + padNum(j, total) + '</button>';
    }
    html += '</div>';

    document.getElementById("app").innerHTML = html;
  }

  function openReserva(index) {
    var rifa = buyer.rifa;
    if (!rifa) return;
    if (buyer.numeros[String(index)]) return;

    var overlay = document.getElementById("numberSheetOverlay");
    var sheet = document.getElementById("numberSheet");
    var label = padNum(index, rifa.cantidad);

    var html = '<h3>Reservar número ' + label + '</h3>';
    if (rifa.precio) html += '<p class="meta-sub" style="margin-bottom:12px;">Valor: ' + fmtMoney(rifa.precio) + '</p>';
    html += '<div class="field"><label>Tu nombre completo</label><input id="rv_nombre" type="text" placeholder="Nombre y apellido"></div>';
    html += '<div class="field"><label>Teléfono de contacto</label><input id="rv_contacto" type="text" placeholder="09xxxxxxxx"></div>';
    html += '<div class="field"><label>Forma de pago</label><select id="rv_formapago">' +
      '<option value="Transferencia">Transferencia</option><option value="Depósito">Depósito</option><option value="Efectivo">Efectivo (coordinar entrega)</option><option value="Otro">Otro</option></select></div>';
    html += '<div class="field"><label>Número de referencia / comprobante</label><input id="rv_referencia" type="text" placeholder="Ej. 000123456 o últimos dígitos"></div>';
    html += '<div class="field"><label>Notas (opcional)</label><textarea id="rv_notas" placeholder="Cualquier detalle adicional"></textarea></div>';
    html += '<div class="sheet-actions">' +
      '<button class="btn ghost" onclick="RifasOnline.closeReserva()">Cancelar</button>' +
      '<button class="btn primary" id="rv_submit_btn" onclick="RifasOnline.submitReserva(' + index + ')">Reservar</button>' +
      '</div>';

    sheet.innerHTML = html;
    overlay.classList.add("open");
  }

  function closeReserva() {
    document.getElementById("numberSheetOverlay").classList.remove("open");
  }

  function submitReserva(index) {
    var rifa = buyer.rifa;
    if (!rifa) return;
    var nombre = document.getElementById("rv_nombre").value.trim();
    var contacto = document.getElementById("rv_contacto").value.trim();
    var formaPago = document.getElementById("rv_formapago").value;
    var referencia = document.getElementById("rv_referencia").value.trim();
    var notas = document.getElementById("rv_notas").value.trim();

    if (!nombre) { showToast("Ingresa tu nombre."); return; }
    if (!referencia) { showToast("Ingresa el número de referencia del pago."); return; }

    var btn = document.getElementById("rv_submit_btn");
    btn.disabled = true;
    btn.textContent = "Reservando...";

    db.collection("rifas").doc(rifa.id).collection("numeros").doc(String(index)).set({
      comprador: nombre,
      contacto: contacto,
      formaPago: formaPago,
      referencia: referencia,
      notas: notas,
      estado: "porpagar",
      creado: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function () {
      closeReserva();
      showToast("¡Número reservado! El administrador confirmará tu pago pronto.");
    }).catch(function (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = "Reservar";
      if (err.code === "permission-denied") {
        showToast("Ese número ya fue reservado por otra persona. Elige otro.");
      } else {
        showToast("No se pudo reservar. Intenta de nuevo.");
      }
    });
  }

  // =========================================================
  // ADMIN VIEW
  // =========================================================

  var admin = {
    user: null,
    rifas: [],
    activeId: null,
    activeRifa: null,
    numeros: {},
    unsubRifas: null,
    unsubNumeros: null,
    unsubRifaDoc: null
  };

  function startAdmin() {
    auth.onAuthStateChanged(function (user) {
      admin.user = user;
      if (user) {
        renderAdminShell();
        subscribeAdminRifas();
      } else {
        renderAdminLogin();
      }
    });
  }

  function renderAdminLogin(errorMsg) {
    var html = '<header class="top"><div class="brand"><h1>🎟️ Rifas · Admin</h1></div></header>';
    html += '<div class="card">';
    html += '<h3 style="margin-bottom:12px;">Iniciar sesión</h3>';
    if (errorMsg) html += '<p style="color:var(--danger);font-size:0.85rem;margin-bottom:10px;">' + escapeHtml(errorMsg) + '</p>';
    html += '<div class="field"><label>Correo</label><input id="ad_email" type="email" placeholder="tucorreo@ejemplo.com"></div>';
    html += '<div class="field"><label>Contraseña</label><input id="ad_pass" type="password" placeholder="••••••••"></div>';
    html += '<button class="btn primary block" onclick="RifasOnline.doLogin()">Entrar</button>';
    html += '</div>';
    document.getElementById("app").innerHTML = html;
  }

  function doLogin() {
    var email = document.getElementById("ad_email").value.trim();
    var pass = document.getElementById("ad_pass").value;
    if (!email || !pass) { showToast("Ingresa correo y contraseña."); return; }
    auth.signInWithEmailAndPassword(email, pass).catch(function (err) {
      renderAdminLogin("Correo o contraseña incorrectos.");
    });
  }

  function doLogout() {
    if (admin.unsubRifas) admin.unsubRifas();
    if (admin.unsubNumeros) admin.unsubNumeros();
    if (admin.unsubRifaDoc) admin.unsubRifaDoc();
    auth.signOut();
  }

  function renderAdminShell() {
    document.getElementById("app").innerHTML = '<div class="spinner-line">Cargando panel...</div>';
  }

  function subscribeAdminRifas() {
    if (admin.unsubRifas) admin.unsubRifas();
    admin.unsubRifas = db.collection("rifas").orderBy("creado", "desc").onSnapshot(function (snap) {
      admin.rifas = [];
      snap.forEach(function (d) { var r = d.data(); r.id = d.id; admin.rifas.push(r); });
      if (!admin.activeId && admin.rifas.length > 0) {
        admin.activeId = admin.rifas[0].id;
        subscribeAdminActiveRifa();
      }
      renderAdminDashboard();
    });
  }

  function subscribeAdminActiveRifa() {
    if (admin.unsubRifaDoc) admin.unsubRifaDoc();
    if (admin.unsubNumeros) admin.unsubNumeros();
    if (!admin.activeId) return;

    admin.unsubRifaDoc = db.collection("rifas").doc(admin.activeId).onSnapshot(function (doc) {
      if (doc.exists) { admin.activeRifa = doc.data(); admin.activeRifa.id = doc.id; }
      renderAdminDashboard();
    });
    admin.unsubNumeros = db.collection("rifas").doc(admin.activeId).collection("numeros").onSnapshot(function (snap) {
      admin.numeros = {};
      snap.forEach(function (d) { admin.numeros[d.id] = d.data(); });
      renderAdminDashboard();
    });
  }

  function renderAdminDashboard() {
    var html = '<header class="top"><div class="brand"><h1>🎟️ Rifas · Admin</h1>' +
      '<button class="admin-link" onclick="RifasOnline.doLogout()">Salir</button></div>' +
      '<div class="meta-sub">' + escapeHtml(admin.user.email) + '</div></header>';

    var options = "";
    admin.rifas.forEach(function (r) {
      options += '<option value="' + r.id + '"' + (r.id === admin.activeId ? " selected" : "") + '>' + escapeHtml(r.nombre) + '</option>';
    });

    html += '<div class="row">';
    if (admin.rifas.length > 0) {
      html += '<select class="rifa-picker" onchange="RifasOnline.switchAdminRifa(this.value)">' + options + '</select>';
    }
    html += '</div>';
    html += '<button class="btn primary block" onclick="RifasOnline.openRifaSheet()">+ Nueva rifa</button>';

    if (!admin.activeRifa) {
      html += '<div class="empty card"><div class="display">Crea tu primera rifa</div><p>Usa el botón de arriba para empezar.</p></div>';
      document.getElementById("app").innerHTML = html;
      return;
    }

    var rifa = admin.activeRifa;
    var total = rifa.cantidad;
    var libres = 0, porpagar = 0, pagados = 0, recaudado = 0;
    var reservas = [];
    for (var i = 0; i < total; i++) {
      var n = admin.numeros[String(i)];
      if (!n) { libres++; continue; }
      if (n.estado === "pagado") { pagados++; recaudado += (rifa.precio || 0); }
      else porpagar++;
      reservas.push({ index: i, n: n });
    }
    reservas.sort(function (a, b) { return a.index - b.index; });

    var buyerLink = window.location.origin + window.location.pathname + "?rifa=" + rifa.id;

    html += '<div class="card">';
    html += '<div class="row" style="justify-content:space-between;align-items:flex-start;">';
    html += '<div><h2 style="font-size:1.1rem;">' + escapeHtml(rifa.nombre) + '</h2>' +
      '<div class="meta-sub">Sorteo: ' + fmtDate(rifa.fecha) + ' · ' + rifa.cantidad + ' números' + (rifa.precio ? ' · ' + fmtMoney(rifa.precio) + ' c/u' : '') + '</div></div>';
    html += '</div>';
    html += '<button class="btn block" style="margin-top:10px;" onclick="RifasOnline.copyBuyerLink(\'' + buyerLink + '\')">🔗 Copiar link para compradores</button>';
    html += '</div>';

    html += '<div class="stats">' +
      '<div class="stat libre"><span class="num">' + libres + '</span><span class="lbl">Libres</span></div>' +
      '<div class="stat porpagar"><span class="num">' + porpagar + '</span><span class="lbl">Por pagar</span></div>' +
      '<div class="stat pagado"><span class="num">' + pagados + '</span><span class="lbl">Pagados</span></div>' +
      '<div class="stat"><span class="num">' + fmtMoney(recaudado) + '</span><span class="lbl">Recaudado</span></div>' +
      '</div>';

    html += '<div class="card">';
    html += '<h3 style="margin-bottom:8px;font-size:1rem;">Reservas (' + reservas.length + ')</h3>';
    if (reservas.length === 0) {
      html += '<p class="meta-sub">Todavía no hay números reservados.</p>';
    } else {
      reservas.forEach(function (r) {
        var label = padNum(r.index, total);
        var n = r.n;
        html += '<div class="list-row"><div class="info">' +
          '<b>' + label + ' — ' + escapeHtml(n.comprador) + '</b>' +
          '<div class="meta-sub">' + escapeHtml(n.contacto || "sin contacto") + ' · ' + escapeHtml(n.formaPago || "") + ' · ref: ' + escapeHtml(n.referencia || "—") + '</div>' +
          (n.notas ? '<div class="meta-sub">Nota: ' + escapeHtml(n.notas) + '</div>' : '') +
          '</div>';
        html += '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">';
        html += '<span class="badge ' + n.estado + '">' + (n.estado === "pagado" ? "Pagado" : "Por pagar") + '</span>';
        html += '<div class="row">';
        if (n.estado !== "pagado") {
          html += '<button class="btn primary" style="padding:6px 10px;font-size:0.78rem;" onclick="RifasOnline.confirmPago(' + r.index + ')">Confirmar pago</button>';
        }
        html += '<button class="btn danger-outline" style="padding:6px 10px;font-size:0.78rem;" onclick="RifasOnline.liberarNumero(' + r.index + ')">Liberar</button>';
        html += '</div></div></div>';
      });
    }
    html += '</div>';

    document.getElementById("app").innerHTML = html;
  }

  function switchAdminRifa(id) {
    admin.activeId = id;
    subscribeAdminActiveRifa();
  }

  function openRifaSheet() {
    var overlay = document.getElementById("rifaSheetOverlay");
    var sheet = document.getElementById("rifaSheet");
    var html = '<h3>Nueva rifa</h3>';
    html += '<div class="field"><label>Nombre de la rifa</label><input id="nr_nombre" type="text" placeholder="Ej. Rifa navideña 2026"></div>';
    html += '<div class="field"><label>Cantidad de números</label><input id="nr_cantidad" type="number" min="1" max="2000" placeholder="Ej. 100"></div>';
    html += '<div class="field"><label>Fecha del sorteo</label><input id="nr_fecha" type="date"></div>';
    html += '<div class="field"><label>Precio por número (opcional)</label><input id="nr_precio" type="number" min="0" step="0.01" placeholder="Ej. 5.00"></div>';
    html += '<div class="sheet-actions">' +
      '<button class="btn ghost" onclick="RifasOnline.closeRifaSheet()">Cancelar</button>' +
      '<button class="btn primary" onclick="RifasOnline.createRifa()">Crear</button></div>';
    sheet.innerHTML = html;
    overlay.classList.add("open");
  }

  function closeRifaSheet() {
    document.getElementById("rifaSheetOverlay").classList.remove("open");
  }

  function createRifa() {
    var nombre = document.getElementById("nr_nombre").value.trim();
    var cantidad = parseInt(document.getElementById("nr_cantidad").value, 10);
    var fecha = document.getElementById("nr_fecha").value;
    var precioRaw = document.getElementById("nr_precio").value;
    var precio = precioRaw ? parseFloat(precioRaw) : 0;

    if (!nombre) { showToast("Ponle un nombre a la rifa."); return; }
    if (!cantidad || cantidad < 1) { showToast("Ingresa una cantidad de números válida."); return; }

    db.collection("rifas").add({
      nombre: nombre,
      cantidad: cantidad,
      fecha: fecha,
      precio: precio,
      creado: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function (ref) {
      admin.activeId = ref.id;
      subscribeAdminActiveRifa();
      closeRifaSheet();
      showToast("Rifa creada.");
    }).catch(function (err) {
      console.error(err);
      showToast("No se pudo crear la rifa.");
    });
  }

  function confirmPago(index) {
    if (!admin.activeRifa) return;
    db.collection("rifas").doc(admin.activeRifa.id).collection("numeros").doc(String(index)).update({
      estado: "pagado"
    }).catch(function (err) {
      console.error(err);
      showToast("No se pudo confirmar el pago.");
    });
  }

  function liberarNumero(index) {
    if (!admin.activeRifa) return;
    if (!confirm("¿Liberar este número? Se perderá la información del comprador.")) return;
    db.collection("rifas").doc(admin.activeRifa.id).collection("numeros").doc(String(index)).delete().catch(function (err) {
      console.error(err);
      showToast("No se pudo liberar el número.");
    });
  }

  function copyBuyerLink(link) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(link).then(function () {
        showToast("Link copiado.");
      }).catch(function () {
        prompt("Copia el link:", link);
      });
    } else {
      prompt("Copia el link:", link);
    }
  }

  // =========================================================
  // BOOT
  // =========================================================

  window.RifasOnline = {
    goToRifa: goToRifa,
    openReserva: openReserva,
    closeReserva: closeReserva,
    submitReserva: submitReserva,
    doLogin: doLogin,
    doLogout: doLogout,
    switchAdminRifa: switchAdminRifa,
    openRifaSheet: openRifaSheet,
    closeRifaSheet: closeRifaSheet,
    createRifa: createRifa,
    confirmPago: confirmPago,
    liberarNumero: liberarNumero,
    copyBuyerLink: copyBuyerLink
  };

  document.addEventListener("click", function (e) {
    if (e.target.id === "numberSheetOverlay") closeReserva();
    if (e.target.id === "rifaSheetOverlay") closeRifaSheet();
  });

  if (isAdminRoute) {
    startAdmin();
  } else {
    startBuyer();
  }
})();
</script>
</body>
</html>
